name: Generate npm lockfile for security review (temporary)

# Branch-scoped, read-only helper. This never writes repository refs or publishes a release.
on:
  push:
    branches: [security/upgrade-eslint-minimatch-20261119]
    paths:
      - 'package.json'
      - '.github/workflows/generate-npm-lockfile-review.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalculate package-lock without running installation scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Ensure regenerated lockfile installs reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject known affected minimatch 7.x-10.x package copies
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const parser = lock.packages['node_modules/@typescript-eslint/typescript-estree'];
          if (!parser) throw Error('TypeScript parser missing');
          const suspect = Object.entries(lock.packages).filter(([path, meta]) => {
            if (!path.endsWith('/minimatch')) return false;
            const major = Number(meta.version?.split('.')[0]);
            return major >= 7 && major < 11;
          });
          if (suspect.length) throw Error('Unpatched minimatch: ' + JSON.stringify(suspect.map(([path, meta]) => [path, meta.version])));
          console.log('Parser version:', parser.version, 'minimatch range:', parser.dependencies?.minimatch);
          NODE
      - name: Print generated lockfile in reviewable chunks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('package-lock.json', 'utf8');
          console.log('EYEZEN_LOCK_BEGIN');
          for (let i = 0, pos = 0; pos < source.length; i++, pos += 1600) {
            console.log('EYEZEN_LOCK_CHUNK_' + String(i).padStart(4, '0') + '=' + JSON.stringify(source.slice(pos, pos + 1600)));
          }
          console.log('EYEZEN_LOCK_END');
          NODE
      - name: Retain exact generated package lock for review
        uses: actions/upload-artifact@v4
        with:
          name: eyezen-review-generated-npm-lockfile
          path: package-lock.json
          retention-days: 3
