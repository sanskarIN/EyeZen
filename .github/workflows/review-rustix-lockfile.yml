name: Generate rustix patched lockfile (temporary review)

on:
  push:
    branches: [security/patch-rustix-1.1.6-v122]
    paths:
      - '.github/workflows/review-rustix-lockfile.yml'

permissions:
  contents: read

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock with compatible patched rustix release
        run: cargo update --manifest-path src-tauri/Cargo.toml -p rustix --precise 1.1.6
      - name: Verify lockfile resolution and print canonical Rustix stanza
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess
          old = subprocess.check_output(["git","show","HEAD:src-tauri/Cargo.lock"],text=True)
          new = Path("src-tauri/Cargo.lock").read_text()
          pattern = r'(?ms)^\[\[package\]\]\nname = "rustix"\n.*?(?=^\[\[package\]\]|\Z)'
          before = list(re.finditer(pattern,old))
          after = list(re.finditer(pattern,new))
          assert len(before)==len(after)==1, "Expected exactly one locked rustix package"
          old_stanza=before[0].group()
          new_stanza=after[0].group()
          assert 'version = "1.1.5"' in old_stanza, "Unexpected rustix source version"
          assert 'version = "1.1.6"' in new_stanza, "Patched rustix version missing"
          assert re.search(r'^checksum = "[a-f0-9]{64}"$',new_stanza,re.M), "Missing canonical crate checksum"
          import difflib
          delta=list(difflib.unified_diff(old.splitlines(),new.splitlines(),fromfile="before/Cargo.lock",tofile="after/Cargo.lock",lineterm=""))
          print("EYEZEN_LOCK_DIFF_BEGIN")
          print("\\n".join(delta))
          print("EYEZEN_LOCK_DIFF_END")
          assert len(delta)<120, "Unusually large dependency change; manual review required"
          print("EYEZEN_RUSTIX_BEGIN")
          print(new_stanza,end="")
          print("EYEZEN_RUSTIX_END")
          print("Cargo.lock changes limited to canonical rustix package stanza")
          PY
      - name: Verify generated manifest and lockfile identities
        run: |
          cargo metadata --format-version 1 --locked --no-deps --manifest-path src-tauri/Cargo.toml > /dev/null
          grep -q 'version = "1.2.2"' src-tauri/Cargo.toml
      - name: Retain exact Cargo.lock for review
        uses: actions/upload-artifact@v4
        with:
          name: eyezen-generated-rustix-1-1-6-cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 3
