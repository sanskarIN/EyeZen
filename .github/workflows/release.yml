name: Publish EyeZen v1.2.2

# Explicit manual gate: normal pushes and documentation edits must never tag a release.
# Candidate builds, CI checks and manual acceptance must be reviewed before dispatch.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type PUBLISH to create the release after checks'
        required: true
        default: 'NO'
      confirm_source_sha:
        description: 'Paste the exact 40-character main commit SHA reviewed for v1.2.2'
        required: true
        default: 'NO'
      confirm_acceptance:
        description: 'Type REVIEWED only after reading the v1.2.2 release checklist and recorded risk disclosures'
        required: true
        default: 'NO'

concurrency:
  group: eyezen-v1-2-2-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm_release == 'PUBLISH'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact commit and explicit acceptance review
        shell: bash
        env:
          CONFIRM_SHA: ${{ inputs.confirm_source_sha }}
          ACCEPTANCE: ${{ inputs.confirm_acceptance }}
        run: |
          set -euo pipefail
          if [[ ! "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$CONFIRM_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::The reviewed full source SHA must match this main-branch workflow run exactly."
            exit 1
          fi
          if [[ "$ACCEPTANCE" != "REVIEWED" ]]; then
            echo "::error::Review the v1.2.2 quality gates and residual risks before publishing."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check:versions
      - run: npm run check:minimatch
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: deb,rpm
            artifact: linux
          - os: windows-latest
            target: msi
            artifact: windows
          - os: macos-latest
            target: dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build libraries (retry signed APT index refresh)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # apt-get update may exit 0 after transient mirror failures, leaving
          # stale indexes and provoking misleading 404s at install time.
          # Error-Mode=any requires a complete signed-index refresh instead.
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Ubuntu package indexes could not be refreshed after three attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run icons
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - run: npm run build
      - name: Build unsigned installers
        run: npx tauri build --bundles ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: eyezen-1.2.2-${{ matrix.artifact }}-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact release versions
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.2"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.2"
          npm run check:versions
          npm run check:minimatch
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.2"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "1.2.2"
          grep -q '^version = "1.2.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: eyezen-1.2.2-*-unsigned
          path: artifacts
          merge-multiple: false
      - name: Validate complete installer set and generate portable SHA-256 manifest
        run: node scripts/verify-release-assets.mjs artifacts 1.2.2
      - name: Publish GitHub release only when all bundles succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.2 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          mapfile -d '' installers < artifacts/release-assets.nul
          if [ "${#installers[@]}" -ne 4 ]; then
            echo "Release manifest did not contain exactly four installers."
            exit 1
          fi
          gh release create v1.2.2 "${installers[@]}" artifacts/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "EyeZen v1.2.2" \
            --notes-file docs/release-notes-v1.2.2.md \
            --latest
 src-tauri/Cargo.toml
          # Locked Rust root identity must also agree with the installer version.
          grep -A2 '^name = "eyezen"
      - uses: actions/download-artifact@v4
        with:
          pattern: eyezen-1.2.2-*-unsigned
          path: artifacts
          merge-multiple: false
      - name: Validate complete installer set and generate portable SHA-256 manifest
        run: node scripts/verify-release-assets.mjs artifacts 1.2.2
      - name: Publish GitHub release only when all bundles succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.2 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          mapfile -d '' installers < artifacts/release-assets.nul
          if [ "${#installers[@]}" -ne 4 ]; then
            echo "Release manifest did not contain exactly four installers."
            exit 1
          fi
          gh release create v1.2.2 "${installers[@]}" artifacts/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "EyeZen v1.2.2" \
            --notes-file docs/release-notes-v1.2.2.md \
            --latest
 src-tauri/Cargo.lock | grep -q '^version = "1.2.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: eyezen-1.2.2-*-unsigned
          path: artifacts
          merge-multiple: false
      - name: Validate complete installer set and generate portable SHA-256 manifest
        run: node scripts/verify-release-assets.mjs artifacts 1.2.2
      - name: Publish GitHub release only when all bundles succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.2 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          mapfile -d '' installers < artifacts/release-assets.nul
          if [ "${#installers[@]}" -ne 4 ]; then
            echo "Release manifest did not contain exactly four installers."
            exit 1
          fi
          gh release create v1.2.2 "${installers[@]}" artifacts/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "EyeZen v1.2.2" \
            --notes-file docs/release-notes-v1.2.2.md \
            --latest

      - uses: actions/download-artifact@v4
        with:
          pattern: eyezen-1.2.2-*-unsigned
          path: artifacts
          merge-multiple: false
      - name: Validate complete installer set and generate portable SHA-256 manifest
        run: node scripts/verify-release-assets.mjs artifacts 1.2.2
      - name: Publish GitHub release only when all bundles succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.2 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          mapfile -d '' installers < artifacts/release-assets.nul
          if [ "${#installers[@]}" -ne 4 ]; then
            echo "Release manifest did not contain exactly four installers."
            exit 1
          fi
          gh release create v1.2.2 "${installers[@]}" artifacts/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "EyeZen v1.2.2" \
            --notes-file docs/release-notes-v1.2.2.md \
            --latest
