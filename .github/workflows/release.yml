name: Build release artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_release_candidate:
        description: 'Type YES after all platform checks and release approval'
        required: true
        default: 'NO'

permissions:
  contents: read

jobs:
  build:
    if: github.event.inputs.confirm_release_candidate == 'YES'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - working-directory: src-tauri
        run: cargo test
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: eyezen-${{ matrix.os }}-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
