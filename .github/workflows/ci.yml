name: Verify EyeZen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eyezen-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend / TypeScript / Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust / multi-platform
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Frontend bundle
        run: npm run build
      - name: Desktop bundle (unsigned)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) npx tauri build --bundles deb,rpm ;;
            Windows) npx tauri build --bundles msi ;;
            macOS) npx tauri build --bundles dmg ;;
          esac
      - name: Save preview installers for manual acceptance
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') }}
        uses: actions/upload-artifact@v4
        with:
          name: eyezen-preview-pr-${{ github.event.pull_request.number }}-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  preview-packages:
    name: Verify release-candidate installer inventory
    needs: rust
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the three tested platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: eyezen-preview-pr-${{ github.event.pull_request.number }}-*
          path: input
          merge-multiple: false
      - name: Resolve and check the release candidate version
        id: candidate
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          npm run check:versions
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected numeric X.Y.Z version in package.json"
            exit 1
          fi
          # Only a release branch for this exact version may supply candidates.
          case "$RELEASE_BRANCH" in
            "release/v${version}" | "release/v${version}-"* | "release/${version}" | "release/${version}-"*) ;;
            *)
              echo "::error::Release branch $RELEASE_BRANCH does not match package version $version"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Arrange bundles by release platform
        shell: bash
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p verified
          mv "input/eyezen-preview-pr-${{ github.event.pull_request.number }}-windows-latest" "verified/eyezen-${VERSION}-windows-unsigned"
          mv "input/eyezen-preview-pr-${{ github.event.pull_request.number }}-macos-latest" "verified/eyezen-${VERSION}-macos-unsigned"
          mv "input/eyezen-preview-pr-${{ github.event.pull_request.number }}-ubuntu-24.04" "verified/eyezen-${VERSION}-linux-unsigned"
      - name: Require MSI, DMG, DEB, RPM with portable SHA-256 manifest
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/verify-release-assets.mjs verified "$VERSION"
      - name: Retain preview checksums for manual testers
        uses: actions/upload-artifact@v4
        with:
          name: eyezen-preview-pr-${{ github.event.pull_request.number }}-checksums
          path: verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
