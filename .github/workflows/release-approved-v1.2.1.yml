name: Publish approved EyeZen v1.2.1 once

# One-time, explicitly approved release on the exact PR #13 merge commit.
# Only that new workflow file changing on main can start this workflow.
# The original manually gated publisher stays unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-approved-v1.2.1.yml'

concurrency:
  group: eyezen-v1-2-1-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: approve EyeZen v1.2.1') &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the independently verified candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin main
          git merge-base --is-ancestor 25de62ac08322219d4fdc437dcd4a17755065d9f HEAD
          test "${GITHUB_REF}" = "refs/heads/main"
      - run: npm ci --no-audit --no-fund
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: deb,rpm
            artifact: linux
          - os: windows-latest
            target: msi
            artifact: windows
          - os: macos-latest
            target: dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run icons
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - run: npm run build
      - name: Build unsigned installers
        run: npx tauri build --bundles ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: eyezen-1.2.1-${{ matrix.artifact }}-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact release versions
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.1"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.1"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.1"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "1.2.1"
          grep -q '^version = "1.2.1"$' src-tauri/Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          pattern: eyezen-1.2.1-*-unsigned
          path: artifacts
          merge-multiple: false
      - name: Validate complete installer set and generate portable SHA-256 manifest
        run: node scripts/verify-release-assets.mjs artifacts 1.2.1
      - name: Publish GitHub release only when all bundles succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          mapfile -d '' installers < artifacts/release-assets.nul
          if [ "${#installers[@]}" -ne 4 ]; then
            echo "Release manifest did not contain exactly four installers."
            exit 1
          fi
          gh release create v1.2.1 "${installers[@]}" artifacts/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "EyeZen v1.2.1" \
            --notes-file docs/release-notes-v1.2.1.md \
            --latest
