[package]
name = "eyezen"
version = "1.1.1"
edition = "2021"
rust-version = "1.90"
description = "Local-first screen comfort and workspace personalization"
license = "MPL-2.0"

[lib]
name = "eyezen_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
